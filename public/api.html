<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ancoreShare Reports</title>
    <link
      rel="stylesheet"
      href="https://your-tenant.eu.qlikcloud.com/resources/autogenerated/qlik-styles.css"
    />
    <script src="https://your-tenant.eu.qlikcloud.com/resources/assets/external/requirejs/require.js"></script>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #fff;
        color: #243e56;
        font-family: Arial, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        padding: 8px;
      }
      .report-object {
        width: 100%;
        height: 40px;
        position: relative;
      }
      #report-buttons[hidden] {
        display: block;
        visibility: hidden;
      }
      .report-object button {
        background: #367bbf !important;
        border-color: #367bbf !important;
        color: #fff !important;
        border-radius: 3px;
        box-shadow: none !important;
      }
      .report-object button:hover {
        background: #2d6ca9 !important;
      }
      .report-object button:focus-visible {
        outline: 2px solid #243e56;
        outline-offset: -3px;
      }
      #loading {
        height: 56px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          #eef2f6 25%,
          #f8fafc 37%,
          #eef2f6 63%
        );
        background-size: 400% 100%;
        animation: loading 1.4s ease infinite;
      }
      #loading[hidden],
      #report-error[hidden] {
        display: none;
      }
      #report-error {
        margin: 0;
        padding: 10px 12px;
        border: 1px solid #efb0ad;
        border-radius: 4px;
        color: #a82f2a;
        font-size: 13px;
      }
      @keyframes loading {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" aria-hidden="true"></div>
    <p id="report-error" role="status" hidden></p>
    <div id="report-buttons" hidden>
      <div id="report-button" class="report-object"></div>
      <div id="context-report-button" class="report-object" style="margin-top: 8px"></div>
    </div>
    <script>
      const APP_ID = "YOUR-APP-ID";
      const REPORT_ID = "dRenfA";
      const CONTEXT_REPORT_ID = "CJjxGy";
      const status = document.getElementById("report-error");
      const loading = document.getElementById("loading");
      const reportButton = document.getElementById("report-buttons");
      let capabilityApp = null;
      let pendingContext = null;
      let reportReady = false;
      let contextReady = false;
      let lastContext = null;
      let applyingContext = false;
      // Execution messages are single-use. They never carry credentials.
      const executionRequests = new Set();
      let executionLocked = false;
      let activeExecutionId = null;
      let afterReportCandidate = null;
      let afterReportAmbiguous = false;
      let dispatchingNativeClick = false;
      const requestedIdentity = new URLSearchParams(location.search).get(
        "identity",
      );
      const sessionIdentity =
        requestedIdentity && /^[A-Za-z0-9._-]{1,128}$/.test(requestedIdentity)
          ? requestedIdentity
          : null;
      const config = {
        host: "your-tenant.eu.qlikcloud.com",
        prefix: "/",
        port: 443,
        isSecure: true,
        webIntegrationId: "YOUR-WEB-INTEGRATION-ID",
      };
      if (sessionIdentity) config.identity = sessionIdentity;
      // ancoreShare reads window.config, not the lexical const binding.
      // The pre-dashboard implementation exposed it through `var config`.
      window.config = config;

      function notifyHost(type, details) {
        if (window.parent !== window)
          window.parent.postMessage(
            Object.assign({ type: type, appId: APP_ID }, details || {}),
            location.origin,
          );
      }

      // Called by the context report's On After Report JavaScript. This marks
      // report generation, not successful delivery/download. Keep the runtime
      // and its context alive while native export handling continues.
      window.ancoreShareReportBridge = {
        afterReport(reportId) {
          const candidate = afterReportCandidate;
          if (!candidate || candidate.reportId !== reportId || candidate.notified || afterReportAmbiguous)
            return false;
          candidate.notified = true;
          notifyHost("ancoreShare:afterReport", {
            executionId: candidate.executionId, reportId: candidate.reportId,
          });
          return true;
        },
      };

      // A manually triggered native report has no host execution ID. Never
      // let its callback close the window for a different pending report.
      reportButton.addEventListener("click", function () {
        if (!dispatchingNativeClick) afterReportAmbiguous = true;
      }, true);

      function revealReport() {
        if (!reportReady || !contextReady) return;
        loading.hidden = true;
        reportButton.hidden = false;
      }

      async function waitForExtensionAuth() {
        // getObject resolves before the extension's asynchronously loaded
        // runtime has finished initializing. Keep its container measurable.
        const deadline = Date.now() + 30000;
        while (typeof window.ancoreSoft?.setQlikHeaders !== "function") {
          if (Date.now() >= deadline)
            throw new Error("ancoreShare did not initialize its Qlik authentication context.");
          await new Promise((resolve) => setTimeout(resolve, 100));
        }
        // Use the extension's own cached CSRF initialization. It obtains the
        // Web Integration ID from window.config and handles the cookie session.
        await window.ancoreSoft.setQlikHeaders();
        const auth = window.ancoreSoft.qlik;
        if (!auth?.CSRFToken || auth.webIntegrationId !== config.webIntegrationId)
          throw new Error("ancoreShare could not initialize Qlik export authentication.");
      }

      function showError(error) {
        console.error("Could not initialize ancoreShare Reports:", error);
        loading.hidden = true;
        reportButton.hidden = true;
        status.hidden = false;
        status.textContent = "The report could not be prepared. Please retry.";
        const message = typeof error === "string" ? error : error?.message || "";
        const code = /no permission to open (?:the )?app/i.test(message)
          ? "report-access-denied"
          : /export authentication/i.test(message) ? "report-auth-failed" : "report-unavailable";
        notifyHost("ancoreShare:error", { code: code });
      }

      function startInteractiveLogin() {
        const returnUrl = new URL(location.href);
        const loginUrl = new URL("https://" + config.host + "/login");
        loginUrl.searchParams.set(
          "qlik-web-integration-id",
          config.webIntegrationId,
        );
        loginUrl.searchParams.set("returnto", returnUrl.href);
        // Qlik's login provider may refuse framing. Let the host offer an
        // explicit new-tab sign-in; never navigate the embedded dashboard.
        if (window.parent !== window) {
          loading.hidden = true;
          reportButton.hidden = true;
          status.hidden = false;
          status.textContent = "Sign in to Qlik in a new tab, then return to the dashboard and try again.";
          notifyHost("ancoreShare:authenticationRequired");
          return;
        }
        // A directly opened report page can use normal top-level login.
        window.location.assign(loginUrl.href);
      }

      function selectionKey(selection) {
        return JSON.stringify(selection.values.map(value =>
          Number.isFinite(value.qNum) ? value.qNum : value.qText).sort());
      }

      async function applyContext(message) {
        if (!capabilityApp) {
          pendingContext = message;
          return;
        }
        if (
          message.appId !== APP_ID ||
          !Array.isArray(message.selections) ||
          !Number.isFinite(message.variables?.vTest)
        )
          throw new Error("Invalid report context.");

        // The first transfer establishes the report session. Later updates
        // touch only changed fields, avoiding clear/reselect feedback into
        // a potentially shared Engine session on every variable change.
        if (!lastContext) await capabilityApp.clearAll(true, "$");
        else for (const previous of lastContext.selections) {
          if (!message.selections.some(next => next.field === previous.field && next.state === previous.state))
            await capabilityApp.field(previous.field, previous.state || "$").clear();
        }
        for (const selection of message.selections) {
          if (
            typeof selection.field !== "string" ||
            !Array.isArray(selection.values)
          )
            throw new Error("Invalid selection context.");
          const previous = lastContext?.selections.find(old => old.field === selection.field && old.state === selection.state);
          if (previous && selectionKey(previous) === selectionKey(selection)) continue;
          const values = selection.values.map(function (value) {
            return Number.isFinite(value.qNum) ? value.qNum : value.qText;
          });
          if (values.length)
            await capabilityApp
              .field(selection.field, selection.state || "$")
              .selectValues(values, false, true);
        }
        if (!lastContext || lastContext.variables.vTest !== message.variables.vTest)
          await capabilityApp.variable.setNumValue(
          "vTest",
          message.variables.vTest,
        );
        lastContext = message;
        status.hidden = true;
        contextReady = true;
        notifyHost("ancoreShare:contextApplied", {
          requestId: message.requestId,
          fieldCount: message.selections.length,
          value: message.variables.vTest,
        });
        revealReport();
      }

      async function drainContext() {
        if (applyingContext || !reportReady || executionLocked) return;
        applyingContext = true;
        reportButton.style.pointerEvents = "none";
        try {
          while (pendingContext) {
            const message = pendingContext;
            pendingContext = null;
            await applyContext(message);
          }
        } catch (error) {
          lastContext = null;
          showError(error);
        } finally {
          applyingContext = false;
          reportButton.style.pointerEvents = "";
        }
      }

      window.addEventListener("message", function (event) {
        if (
          event.origin !== location.origin ||
          event.source !== window.parent
        )
          return;
        if (event.data?.type === "ancoreShare:afterReportEvent" && event.data.appId === APP_ID) {
          window.ancoreShareReportBridge.afterReport(event.data.reportId);
          return;
        }
        if (event.data?.type === "ancoreShare:execute") {
          void executeReport(event.data);
          return;
        }
        if (event.data?.type === "ancoreShare:releaseExecution" && event.data.appId === APP_ID) {
          // A manual native click must not poison every later direct request.
          // Keep ambiguity only when an earlier automatic execution is still
          // unresolved as the next request begins.
          afterReportAmbiguous = Boolean(afterReportCandidate && !afterReportCandidate.notified);
          afterReportCandidate = null;
          activeExecutionId = null;
          executionLocked = false;
          void drainContext();
          return;
        }
        if (event.data?.type !== "ancoreShare:setContext") return;
        pendingContext = event.data;
        void drainContext();
      });

      async function executeReport(message) {
        if (message.appId !== APP_ID ||
            typeof message.executionId !== "string" ||
            !/^[A-Za-z0-9._-]{1,128}$/.test(message.executionId) ||
            ![REPORT_ID, CONTEXT_REPORT_ID].includes(message.reportId)) return;
        if (executionRequests.has(message.executionId)) return;
        executionRequests.add(message.executionId);
        const result = { executionId: message.executionId };
        if (executionLocked || !reportReady || !contextReady || applyingContext || pendingContext ||
            lastContext?.requestId !== message.contextRequestId) {
          notifyHost("ancoreShare:executionRejected", result);
          return;
        }
        executionLocked = true;
        activeExecutionId = message.executionId;
        try {
          // Use the existing native button, preserving extension events and its
          // progress UI. getObject/auth readiness can precede the actual DOM.
          const container = document.getElementById(
            message.reportId === REPORT_ID ? "report-button" : "context-report-button");
          const deadline = Date.now() + 15000;
          let button;
          while (!(button = container.querySelector("button:not([disabled]):not([aria-disabled='true'])"))) {
            if (activeExecutionId !== message.executionId) return;
            if (Date.now() >= deadline) throw new Error("Report button is not ready.");
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          if (activeExecutionId !== message.executionId) return;
          afterReportCandidate = {
            executionId: message.executionId, reportId: message.reportId, notified: false,
          };
          dispatchingNativeClick = true;
          try { button.click(); }
          finally { dispatchingNativeClick = false; }
          // This confirms click dispatch only, never export completion.
          notifyHost("ancoreShare:executionDispatched", result);
        } catch (error) {
          console.error("Could not dispatch report execution:", error);
          notifyHost("ancoreShare:executionUncertain", result);
          // Keep the context locked; never automatically repeat a report.
        }
      }

      require.config({
        baseUrl: "https://" + config.host + "/resources",
        webIntegrationId: config.webIntegrationId,
      });
      fetch("https://" + config.host + "/api/v1/users/me", {
        method: "GET",
        mode: "cors",
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          "qlik-web-integration-id": config.webIntegrationId,
        },
      })
        .then(function (response) {
          if (response.status === 401 || response.status === 403) {
            startInteractiveLogin();
            return;
          }
          if (!response.ok)
            throw new Error("Qlik session check failed: " + response.status);
          require(
            ["js/qlik"],
            function (qlik) {
              qlik.setOnError(showError);
              capabilityApp = qlik.openApp(APP_ID, config);
              Promise.all([
                capabilityApp.getObject("report-button", REPORT_ID),
                capabilityApp.getObject("context-report-button", CONTEXT_REPORT_ID),
              ])
                .then(async function () {
                  await waitForExtensionAuth();
                  reportReady = true;
                  revealReport();
                  notifyHost("ancoreShare:ready");
                  void drainContext();
                })
                .catch(showError);
            },
            showError,
          );
        })
        .catch(showError);
    </script>
  </body>
</html>
